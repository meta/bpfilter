# The upstream spec is the source of truth for Fedora and EPEL packages.
# Packit also syncs this configuration to dist-git for Koji and Bodhi jobs.
upstream_project_url: https://github.com/meta/bpfilter
upstream_package_name: bpfilter
downstream_package_name: bpfilter
upstream_tag_template: v{version}
specfile_path: tools/rpm/bpfilter.spec

jobs:
  - job: copr_build
    trigger: pull_request
    targets:
      - fedora-all-x86_64
      - fedora-all-aarch64
      - epel-9-x86_64
      - epel-9-aarch64
      - epel-10-all-x86_64
      - epel-10-all-aarch64

  - job: propose_downstream
    trigger: release
    dist_git_branches:
      - fedora-all
      - epel-9
      - epel-10-all

  - job: koji_build
    trigger: commit
    dist_git_branches:
      - fedora-all
      - epel-9
      - epel-10-all
    allowed_pr_authors:
      - packit
      - naccyde

  - job: bodhi_update
    trigger: commit
    dist_git_branches:
      - fedora-branched
      - epel-9
      - epel-10-all
